name: Resolve release dependencies
on:
  push:
    branches: [release/pilot-hosted-beta]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --save-dev vitest@5.0.5
      - run: npm audit fix --package-lock-only --ignore-scripts
      - name: Return resolved manifests for review
        run: |
          node -e "for(const p of ['package.json','package-lock.json']) console.log('VT_MANIFEST '+p+' '+Buffer.from(require('fs').readFileSync(p)).toString('base64'))"
