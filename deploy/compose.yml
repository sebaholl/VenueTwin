# Single instance only. Do not scale this in-memory worker horizontally.
services:
  api:
    build: ..
    env_file: api.env
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
